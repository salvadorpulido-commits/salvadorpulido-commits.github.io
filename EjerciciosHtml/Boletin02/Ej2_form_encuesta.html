<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2: Encuesta de Preferencias de Desarrollo</title>
</head>

<body>

    <!-- Configura el envío mediante POST hacia https://lm.ciclo.iesnervion.es/encuesta.php.
        Agrupa los elementos en dos bloques principales utilizando <fieldset> y <legend>:

        Bloque 1: Datos Académicos
        Nombre y Apellidos (Campo de texto obligatorio) (nombre).
        Ciclo Formativo (Lista desplegable <select> con las opciones: DAM, DAW, ASIR). 
        La opción DAM debe aparecer seleccionada por defecto. (ciclo)

        Bloque 2: Preferencias Técnicas
        Lenguaje principal (Botones de radio <input type="radio">: Java, Python, C#, JavaScript). 
            Solo debe ser posible seleccionar uno a la vez. (lenguaje)
        Entornos de trabajo habituales (Casillas de verificación <input type="checkbox">: Linux, Windows, macOS). 
            Permitir selección múltiple. (entornos)
        Comentarios / Experiencia previa (Área de texto <textarea> con 4 filas y 40 columnas). (comentarios)
            
        Añade un botón para restablecer el formulario (type="reset") y otro para enviar los datos (type="submit").-->

    <h1>Encuesta de Preferencias de Desarrollo</h1>

    <form action="https://lm.ciclo.iesnervion.es/encuesta.php" method="POST">

        <fieldset>
            <legend>Datos Académicos</legend>

            <label for="nombre">Nombre y Apellidos</label>
            <input name="nombre" id="nombre" type="text" placeholder="Ingresa tu Nombre y Apellidos" required>
            <br>
            <label for="ciclo">Ciclo Formativo</label>
            <select name="ciclo" id="ciclo">
               
                    <option value="DAM" selected>DAM</option>
                    <option value="DAW">DAW</option>
                    <option value="ASIR">ASIR</option>
            
            </select>
 
        </fieldset>
        <br>
        <fieldset>
            <legend>Preferencias Técnicas</legend>

            <p>
                <label>Lenguajes</label>
                <input type="radio" name="lenguaje" value="Java">Java
                <input type="radio" name="lenguaje" value="Python">Python
                <input type="radio" name="lenguaje" value="C#">C#
                <input type="radio" name="lenguaje" value="JavaScript">JavaScript

            </p>
          
            <p>
                <label>Entornos de Trabajo</label>
                <input type="checkbox" name="entornos[]" value="Linux">Linux
                <input type="checkbox" name="entornos[]" value="Windows">Windows
                <input type="checkbox" name="entornos[]" value="MacOs">MacOs
                
            </p>

            <p>
                <label>Comentarios/Experiencia previa</label>
                <br>
                <textarea name="comentarios" id="comentarios" 4 rows="4" cols="40"  placeholder="Comenta aquí:"></textarea>
            </p>

            <p>
                <button type="reset">Restablecer formulario</button>

            </p>

            <p>
                <button type="submit">Enviar formulario</button>
            </p>



        </fieldset>

    </form>

</body>

</html>
