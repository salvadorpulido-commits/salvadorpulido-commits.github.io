    <h1>Ejercicio 5: Práctica Guiada de Elementos Embebidos y Contenido Multimedia</h1>


    <!--Sección 1: Marcos e Integración Externa (<iframe>, <embed> y <object>)
        Tarea A (<iframe>): Busca un vídeo en YouTube sobre HTML5 o programación. Haz clic en Compartir > Insertar, copia el código de incrustación e intégralo en tu página.
        Ajusta sus dimensiones a width="560" y height="315".
        Añade el atributo loading="lazy" para optimizar la carga y un atributo title="Vídeo tutorial de HTML5" por accesibilidad.-->

    <h3>· Sección 1: Marcos e Integración Externa</h3>    

    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/QC9_8nRNNHA?si=brfH5AnBvLpa5LFX" 
        title="Vídeo tutorial de HTML5" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        loading="lazy" 
        allowfullscreen>
    </iframe>



</body>
