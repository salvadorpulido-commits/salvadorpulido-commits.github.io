<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>

<body>
    <form action="https://www.w3schools.com/action_page.php" method="post">
        <fieldset>
            <legend>Información de contacto</legend>
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="nombre" placeholder="Escribe tu nombre"><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br>
            <label for="message">Mensaje:</label>
            <textarea id="message" name="mensaje"></textarea>
            <p>
            <label for="Mascota">¿Tienes Mascota?</label>
            <input type="checkbox" name="Tiene mascota">
            </p>

            <p>
                <label>Sexo</label>
                <input type="radio" name="Sexo" value="hombre">Hombre
                <input type="radio" name="Sexo" value="mujer">Mujer
                <input type="radio" name="Sexo" value="nsnc">NsNc
                
            </p>
            <label for="numero">Edad</label>
            <input type="number" name="numero" id="numero" min="16" max="50">
           </fieldset>
        <input type="submit" value="Enviar">
        <button type="button" id="boton">boton</button>
    </form>
<br>

<!-- Formulario de ejemplo de la moodle -->

    <form action="https://www.w3schools.com/action_page.php" method="post">
    <fieldset>
        <legend>Datos personales</legend>
        <label for="nombre">Nombre y apellidos: </label>
        <input name="nombre" id="nombre" type="text"><br>
        <label for="socio">Socio:</label>
        <select name="socio" id="socio">
            <!--Etiqueta option-->
            <option value="value1">Sí<option>
            <option value="value2" selected>No<option>
        </select><br><br>
        <label>Edad: </label>
        <input name="edad" type="radio" value="20-39"> 20-39
        <input name="edad" type="radio" value="40-59"> 40-59
        <input name="edad" type="radio" value="60-79"> 60-79<br><br>
        <label for="email">Email: </label>
        <input id="email" name="email" type="email"><br><br>
        <label for="estudios">Estudios: </label>
        <select name="estudios" id="estudios">
            <optgroup label="Estudios Universitarios">
                <option>Doctorado</option>
                <option>Máster</option>
                <option>Grado</option>
            </optgroup>
            <optgroup label="Ciclo Formativo">
                <option>Grado Superior</option>
                <option>Grado Medio</option>
            </optgroup>
        </select><br><br>
        <label for="navegador">Elige tu navegador favorito: </label>
        <input name="navegador" id="navegador" list="browsers">
        <datalist name="browsers" id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Internet Explorer">
            <option value="Opera">
            <option value="Safari">
            <option value="Microsoft Edge">
        </datalist><br><br>
        <label for="mensaje">Escribe tu mensaje: </label>
        <textarea rows="10" cols="50" placeholder="Mensaje" id="mensaje" name="mensaje" ></textarea>
    </fieldset>
    <input type="submit" name="enviar" value="Enviar">
    
</form>
</body>



</html>
